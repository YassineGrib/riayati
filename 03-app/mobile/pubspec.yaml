name: riayati
description: Riayati Arabic Android application.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  intl: ^0.20.3
  open_filex: ^5.0.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/legacy.png
  min_sdk_android: 21
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  adaptive_icon_foreground_inset: 0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: ThmanyahSans
      fonts:
        - asset: assets/fonts/thmanyah/thmanyahsans-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyah/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyah/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyah/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyah/thmanyahsans-Black.otf
          weight: 900
    - family: ThmanyahSerifDisplay
      fonts:
        - asset: assets/fonts/thmanyah/thmanyahserifdisplay-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyah/thmanyahserifdisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyah/thmanyahserifdisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyah/thmanyahserifdisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyah/thmanyahserifdisplay-Black.otf
          weight: 900
    - family: ThmanyahSerifText
      fonts:
        - asset: assets/fonts/thmanyah/thmanyahseriftext-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyah/thmanyahseriftext-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyah/thmanyahseriftext-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyah/thmanyahseriftext-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyah/thmanyahseriftext-Black.otf
          weight: 900
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/plex/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/plex/IBMPlexSansArabic-Bold.ttf
          weight: 700
