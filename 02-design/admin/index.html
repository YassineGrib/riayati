      NAV.map(n => '<a href="#"' + (n[0] === frame.dataset.nav ? ' aria-current="page"' : '') + '><svg class="i"><use href="#' + n[2] + '"/></svg>' + n[1] + (n[3] ? '<span class="count">' + n[3] + '</span>' : '') + '</a>').join('') +
      '</nav><div class="side-foot"><span class="avatar-s">م</span><div><b>المسؤول</b><small>admin@example.com</small></div></div>';
    const main = document.createElement('div'); main.className = 'main';
    const top = document.createElement('header'); top.className = 'atop';
    top.innerHTML = '<div class="crumbs"><span>' + c1 + '</span><svg class="i sm"><use href="#a-chev"/></svg><b>' + c2 + '</b></div><div class="tools"><button class="ib" aria-label="بحث"><svg class="i"><use href="#a-search"/></svg></button><button class="ib" aria-label="الإشعارات"><svg class="i"><use href="#a-bell"/></svg><i class="dot"></i></button><button class="ib" aria-label="تسجيل الخروج"><svg class="i"><use href="#a-logout"/></svg></button></div>';
    page.parentNode.insertBefore(main, page); main.appendChild(top); main.appendChild(page);
    frame.insertBefore(side, frame.firstChild);
  }
  document.querySelectorAll('.dframe[data-nav]').forEach(shell);
  // 5: clone the list and add a modal
  const src = document.getElementById('legal-list'), dst = document.getElementById('legal-delete');
  dst.innerHTML = src.innerHTML;
  dst.dataset.nav = 'legal';
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = '<div class="modal" role="alertdialog" aria-labelledby="dm-t" aria-describedby="dm-d"><span class="ico"><svg class="i"><use href="#a-trash"/></svg></span><h2 id="dm-t">حذف النص؟</h2><p id="dm-d">سيُحذف «قانون الأسرة · المادة 64» ولن يستخدمه المساعد بعد الآن. لا يمكن التراجع عن هذا الإجراء.</p><div class="btns"><button class="btn-a danger">حذف</button><button class="btn-a outline">إلغاء</button></div></div>';
  dst.appendChild(scrim);

  var root = document.documentElement, btn = document.getElementById('theme');
  btn.addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') !== 'dark';
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.setAttribute('aria-pressed', String(dark));
    btn.textContent = dark ? 'Light theme' : 'Dark theme';
  });
</script>
